aid: wattpad
name: Wattpad
description: >-
  Wattpad is a Toronto-based social storytelling platform where a global
  community of more than 90 million writers and readers create, share, and
  read serialized original fiction across every genre. Founded in 2006 and
  acquired by Naver (WEBTOON) in 2021, Wattpad extends its stories into
  publishing, film, and TV through Wattpad WEBTOON Studios. Wattpad formerly
  operated a public developer API (developer.wattpad.com), but public access
  was discontinued around April 2018 and the API is now internal-only, so this
  profile captures the company's web properties and operational surface rather
  than an active API program.
